backend:
  name: github
  repo: Won-Jy/archive-wonjy
  branch: main

media_folder: images
public_folder: /images

collections:
  # ─────────────────────────────────────────────────────────────
  # Work — work/{year}/{slug}.md
  # ─────────────────────────────────────────────────────────────
  - name: work
    label: Work
    label_singular: Work
    folder: work
    create: true
    media_folder: "/images{{dirname}}/{{filename}}"
    public_folder: "/images{{dirname}}/{{filename}}"
    extension: md
    format: yaml-frontmatter
    path: "{{fields.year_start}}/{{slug}}"
    slug: "{{title}}"
    summary: "{{title}}"
    sortable_fields: [title, year_start, status]
    view_groups:
      - label: Year
        field: year_start
    fields:
      - { name: layout, widget: hidden, default: work }

      - { name: title, label: Title, widget: string }

      - { name: drafts, label: "초고 (사이트에 안 나감)", widget: text, required: false,
          preview: false,
          hint: "자유롭게 쓰세요. 다듬어지면 아래 Summary나 Description으로 옮기시면 됩니다." }

      - name: types
        label: Type
        widget: select
        multiple: true
        options: [Highlight, Exhibition, Project, Single work, Writing]
        hint: "Highlight는 첫 화면에 띄우는 표시입니다. 페이지에는 안 보입니다."

      - { name: year_start, label: Year (from), widget: number, value_type: int, preview: false }
      - { name: year_end, label: Year (to), widget: number, value_type: int, required: false, preview: false,
          hint: "진행 중이면 비워두세요. 그러면 '2024 –' 처럼 표시됩니다." }
      - { name: date_start, label: Date, widget: datetime, date_format: "YYYY-MM-DD",
          time_format: false, picker_utc: true, required: false,
          hint: "목록 정렬에 쓰입니다. 연도만 아는 경우 비워두셔도 됩니다." }

      - { name: status, label: Status, widget: select,
          options: [Completed, In progress, In preparation] }

      - name: tags
        label: Tags
        widget: select
        multiple: true
        required: false
        create: true
        options: [Cave, City, Garden, Map, Newcomer, Pigeon, Stone, Wall, Water]

      - { name: cover, label: Cover image, widget: image, required: false }
      - { name: cover_caption, label: Cover caption, widget: string, required: false,
          hint: "<i>기울임</i> 같은 HTML을 쓸 수 있습니다." }

      # ── 사이트에 나가는 글 ────────────────────────────────────
      - { name: summary, label: "Summary (사이트에 표시)", widget: text, required: false }
      - { name: description, label: "Description (사이트에 표시)", widget: text, required: false,
          hint: "긴 글은 여기에 씁니다." }

      # ── 미디어 ────────────────────────────────────────────────
      - name: media
        label: Images & videos
        label_singular: Item
        widget: list
        required: false
        collapsed: true
        types:
          - name: image
            label: Image
            summary: "{{fields.caption}}"
            fields:
              - { name: src, label: File, widget: image }
              - { name: caption, label: Caption, widget: string, required: false }
          - name: video
            label: Video
            summary: "{{fields.caption}}"
            fields:
              - { name: src, label: Embed URL, widget: string,
                  hint: "Vimeo나 YouTube의 embed 주소를 넣으세요." }
              - { name: caption, label: Caption, widget: string, required: false }
          - name: divider
            label: Divider
            summary: "— 구분선 —"
            fields:
              - { name: spacer, widget: hidden, required: false }

      - { name: hide_cover_if_video_top, label: "영상이 첫 항목이면 커버 숨기기",
          widget: boolean, required: false }

      # ── 연결 ──────────────────────────────────────────────────
      - { name: linked_works_title, widget: hidden, default: "Linked works" }
      - name: linked_works
        label: Linked works
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.label}}"
        fields:
          - { name: label, label: 표시 이름, widget: string, required: false }
          - { name: path, label: 주소, widget: string, required: false,
              hint: "/work/2023/hostis.html — 아직 없는 페이지를 적어두면 회색으로 표시됩니다." }

      - { name: critique_title, widget: hidden, default: "Related texts" }
      - name: related_texts
        label: Related texts
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.id}}"
        fields:
          - { name: id, label: Text, widget: relation, required: false,
              collection: texts, search_fields: [title_en, id], value_field: id,
              display_fields: [title_en] }

  # ─────────────────────────────────────────────────────────────
  # Texts — _data/texts/{id}.yml (front matter 없는 순수 YAML)
  # ─────────────────────────────────────────────────────────────
  - name: texts
    label: Texts
    label_singular: Text
    folder: _data/texts
    create: true
    extension: yml
    format: yaml
    slug: "{{title_en}}"
    identifier_field: id
    summary: "{{date_written | date('YYYY')}}  {{author.name}} — {{title_en}}"
    sortable_fields: [year, author.family, title_en, id]
    fields:
      - { name: id, label: ID, widget: string,
          hint: "파일 이름과 같아야 합니다. 작업에서 이 글을 연결할 때 쓰는 이름입니다." }

      - name: title_original
        label: 원문 제목
        widget: object
        fields:
          - { name: text_html, label: 제목, widget: string }
          - { name: language, label: 언어, widget: string,
              hint: "fr, en, sv 처럼 두 글자로." }

      - { name: title_en, label: 영문 제목, widget: string, required: false }

      - name: author
        label: 필자
        widget: object
        fields:
          - { name: name, label: 이름 (표시용), widget: string, required: false,
              hint: "사이트에 나오는 이름입니다. 예: Gunilla Petri" }
          - { name: family, label: 성 (정렬용), widget: string, required: false,
              hint: "에디터 목록을 성으로 정렬할 때만 씁니다. 사이트에는 안 나옵니다." }
          - { name: bio_html, label: 소개, widget: text, required: false }

      - { name: year, label: 연도, widget: number, value_type: int, preview: false }
      - { name: date_written, label: 작성일, widget: datetime,
          date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }

      - { name: source_html, label: 출처, widget: text, required: false }

      - name: original
        label: 원문
        widget: object
        fields:
          - { name: language, label: 언어, widget: string }
          - { name: body_html, label: 본문, widget: text }

      - name: translations
        label: 번역
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.language}}"
        fields:
          - { name: language, label: 언어, widget: string }
          - { name: translator, label: 번역자, widget: string, required: false }
          - { name: body_html, label: 본문, widget: text }

      - name: notes
        label: 주석
        widget: list
        required: false
        collapsed: true
        fields:
          - { name: text, label: 내용, widget: text, required: false }

      - name: related_works
        label: 관련 작업
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.label}}"
        fields:
          - { name: label, label: 표시 이름, widget: string, required: false }
          - { name: slug, label: 경로, widget: string, required: false,
              hint: "work/2023/hostis — 앞의 / 와 뒤의 .html 은 빼고 적습니다." }

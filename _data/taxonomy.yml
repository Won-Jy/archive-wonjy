# Type · Tag 목록.
# 에디터의 "관리 → Type · Tag" 화면이 이 파일과 admin/config.yml 을 함께 고칩니다.
# 손으로 고쳐도 되지만, 이름을 바꾸면 work/*.md 안의 값도 같이 바꿔야 합니다.
groups:
  types:
    - Highlight
    - Exhibition
    - Project
    - Single work
    - Writing
  # 목록 화면의 "그룹: Type" 에서 뺄 항목.
  # Highlight 처럼 거의 모든 작업에 붙는 것은 빼야 그룹이 쓸모 있습니다.
  # (필터 버튼과 작업 편집 화면의 선택지에는 그대로 나옵니다.)
  group_exclude:
    - Highlight
  tags:
    - Cave
    - City
    - Garden
    - Map
    - Newcomer
    - Pigeon
    - Stone
    - Wall
    - Water

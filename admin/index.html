---
# Jekyll 이 처리하도록 비워둔 front matter. 아래 ?v= 를 빌드 때마다 갱신해서
# 브라우저가 옛 table-editor.js 를 계속 쓰는 일을 막는다.
---
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>archive-wonjy — 편집</title>
  <link rel="icon" href="/favicon.png">
  <link href="config.yml" type="text/yaml" rel="cms-config-url">
  <style>
    /* Images & videos 목록의 각 항목에 번호를 붙인다 (표시만; 저장되는 내용과 무관) */
    .item-list { counter-reset: wj-item; }
    .item-list > .item-wrapper { counter-increment: wj-item; }
    .item-list > .item-wrapper .header .start .type::before {
      content: counter(wj-item) ".";
      display: inline-block;
      min-width: 1.6em;
      margin-right: 4px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <script src="sveltia-cms.js"></script>
  <script>
    /* 표 편집기가 사진 목록을 읽을 때 쓰는 저장소 정보 */
    window.CMS_CONFIG_BACKEND = { repo: 'Won-Jy/archive-wonjy', branch: 'main' };
  </script>
  <script src="table-editor.js?v={{ site.time | date: '%s' }}"></script>
  <script>CMS.init();</script>
</body>
</html>

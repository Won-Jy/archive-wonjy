backend:
  name: github
  repo: Won-Jy/archive-wonjy
  branch: main

# 주소(파일 이름) 규칙: 악센트를 떼고 영문 알파벳·숫자·하이픈만 남긴다.
# 이미 있는 페이지 주소는 그대로고, 앞으로 만드는 것부터 적용된다.
slug:
  encoding: ascii
  clean_accents: true

media_folder: images
public_folder: /images

collections:
  # ─────────────────────────────────────────────────────────────
  # Work — work/{year}/{slug}.md
  # ─────────────────────────────────────────────────────────────
  - name: work
    label: Work
    label_singular: Work
    folder: work
    create: true
    # 이미지가 저장되는 곳: images/<작업주소>/  (예: images/book-of-the-dead/)
    # 주의 — 한 칸(슬래시와 슬래시 사이)에 글자와 {{...}} 를 섞으면 안 된다.
    # 예전 설정 "/images{{dirname}}/{{filename}}" 은 'images' 와 '{{dirname}}' 이
    # 한 칸에 붙어 있어서, 이미 올라간 사진을 고를 때 주소가
    # /imagesimages/2016/... 처럼 'images' 가 두 번 붙어 나왔다.
    media_folder: "/images/{{slug}}"
    public_folder: "/images/{{slug}}"
    extension: md
    format: yaml-frontmatter
    path: "{{fields.year_start}}/{{slug}}"
    slug: "{{title}}"
    summary: "{{title}}"
    sortable_fields: [title, year_start, status]
    # >>> taxonomy:views — 여기부터 아래 <<< 줄까지는 "관리 → Type · Tag" 화면이 다시 씁니다.
    view_groups:
      - { label: Year, field: year_start }
      - { label: Type, field: types_all, pattern: "Single work|Exhibition|Project|Writing" }
      - { label: Tag,  field: tags_all,  pattern: "Newcomer|Garden|Pigeon|Stone|Water|Cave|City|Wall|Map" }
      - { label: Status, field: status }
    view_filters:
      - { label: "Type · Highlight", field: types_all, pattern: "(^|,)Highlight(,|$)" }
      - { label: "Type · Exhibition", field: types_all, pattern: "(^|,)Exhibition(,|$)" }
      - { label: "Type · Project", field: types_all, pattern: "(^|,)Project(,|$)" }
      - { label: "Type · Single work", field: types_all, pattern: "(^|,)Single work(,|$)" }
      - { label: "Type · Writing", field: types_all, pattern: "(^|,)Writing(,|$)" }
      - { label: "Tag · Cave", field: tags_all,  pattern: "(^|,)Cave(,|$)" }
      - { label: "Tag · City", field: tags_all,  pattern: "(^|,)City(,|$)" }
      - { label: "Tag · Garden", field: tags_all,  pattern: "(^|,)Garden(,|$)" }
      - { label: "Tag · Map", field: tags_all,  pattern: "(^|,)Map(,|$)" }
      - { label: "Tag · Newcomer", field: tags_all,  pattern: "(^|,)Newcomer(,|$)" }
      - { label: "Tag · Pigeon", field: tags_all,  pattern: "(^|,)Pigeon(,|$)" }
      - { label: "Tag · Stone", field: tags_all,  pattern: "(^|,)Stone(,|$)" }
      - { label: "Tag · Wall", field: tags_all,  pattern: "(^|,)Wall(,|$)" }
      - { label: "Tag · Water", field: tags_all,  pattern: "(^|,)Water(,|$)" }
      - { label: "Status · Completed", field: status,    pattern: "^Completed$" }
      - { label: "Status · In progress", field: status,    pattern: "^In progress$" }
      - { label: "Status · In preparation", field: status,    pattern: "^In preparation$" }
    # <<< taxonomy:views
    fields:
      - { name: layout, widget: hidden, default: work }

      - { name: title, label: Title, widget: string,
          hint: "페이지 주소가 이 제목으로 만들어집니다. 한글만 적으면 주소가 임의의 문자가 되니 영문/불어 제목으로 적어주세요." }

      - { name: drafts, label: "초고 (사이트에 안 나감)", widget: text, required: false,
          preview: false,
          hint: "자유롭게 쓰세요. 다듬어지면 아래 Summary나 Description으로 옮기시면 됩니다." }

      - name: types
        label: Type
        widget: select
        multiple: true
        # >>> taxonomy:types
        options: ["Highlight", "Exhibition", "Project", "Single work", "Writing"]
        # <<< taxonomy:types
        hint: "Highlight는 첫 화면에 띄우는 표시입니다. 페이지에는 안 보입니다."

      # 목록 화면의 필터·그룹이 읽는 숨은 값. 위의 Type/Tag 를 쉼표로 이어붙인 것.
      # 왜 필요한가: Sveltia 는 여러 값 필드를 types.0, types.1 로 펴서 들고 있어서
      # 필터가 `types` 를 보면 아무것도 못 찾는다 (실제로 "No entries found" 가 났다).
      # 이 값은 작업을 저장할 때마다 taxonomy-editor.js 의 preSave 훅이 자동으로 채우고,
      # "관리 → Type · Tag" 화면의 적용도 같이 채운다. 사람이 건드릴 필요 없다.
      - { name: types_all, widget: hidden, required: false, preview: false }

      - { name: year_start, label: Year (from), widget: number, value_type: int, preview: false }
      - { name: year_end, label: Year (to), widget: number, value_type: int, required: false, preview: false,
          hint: "진행 중이면 비워두세요. 그러면 '2024 –' 처럼 표시됩니다." }
      - { name: date_start, label: Date, widget: datetime, date_format: "YYYY-MM-DD",
          time_format: false, picker_utc: true, required: false,
          hint: "목록 정렬에 쓰입니다. 연도만 아는 경우 비워두셔도 됩니다." }

      - name: status
        label: Status
        widget: select
        # >>> taxonomy:status
        options: ["Completed", "In progress", "In preparation"]
        # <<< taxonomy:status

      - name: tags
        label: Tags
        widget: select
        multiple: true
        required: false
        create: true
        # >>> taxonomy:tags
        options: ["Cave", "City", "Garden", "Map", "Newcomer", "Pigeon", "Stone", "Wall", "Water"]
        # <<< taxonomy:tags

      - { name: tags_all, widget: hidden, required: false, preview: false }

      # ── 사이트에 나가는 글 ────────────────────────────────────
      # 글상자. 글자를 고르고 버튼(또는 Ctrl+B / Ctrl+I)을 누르면 서식이 붙는다.
      # 오른쪽 위 전환으로 원문(마크다운)을 직접 볼 수도 있다.
      # Enter 한 번 = 줄바꿈, 빈 줄 = 새 문단 (_config.yml 의 hard_wrap: true).
      - name: summary
        label: "Summary (사이트에 표시)"
        widget: markdown
        required: false
        modes: [rich_text, raw]
        buttons: [bold, italic, link]
        editor_components: []
        minimal: true
        hint: "짧게. 링크는 글자를 고르고 링크 버튼을 누르세요 — 사이트에서 파란 글씨로 나옵니다."
      - name: description
        label: "Description (사이트에 표시)"
        widget: markdown
        required: false
        modes: [rich_text, raw]
        buttons: [bold, italic, link]
        editor_components: []
        hint: "긴 글은 여기에 씁니다. 다른 작업으로 링크를 걸 때는 그 페이지 주소(예: /work/2023/hostis.html)를 넣으세요."

      # ── 본문 (Writing 처럼 글이 주인 작업) ──────────────────────
      # 파일의 앞머리 아래에 통째로 들어가는 긴 글. 대부분의 작업에서는 비워둔다.
      # 사진 버튼으로 글 중간에 사진을 넣을 수 있고, 사진 바로 다음 줄에
      # 기울임으로 한 줄 적으면 사이트에서 캡션처럼 나온다.
      - name: body
        label: "본문 (긴 글 · 사진 넣기 가능)"
        widget: markdown
        required: false
        modes: [rich_text, raw]
        buttons: [bold, italic, link]
        editor_components: [image]
        hint: "Writing 처럼 글이 주인 작업에 씁니다. 주석 번호는 [[1]] 처럼 적고, 아래 '주석'에 내용을 적으세요. 사진 바로 다음 줄에 기울임으로 한 줄 적으면 캡션이 됩니다."
      - { name: notes_title, widget: hidden, default: "Notes" }
      - name: notes
        label: "주석 (본문용)"
        widget: list
        required: false
        collapsed: true
        summary: "[{{fields.id}}] {{fields.text}}"
        fields:
          - { name: id, label: 번호, widget: number, value_type: int,
              hint: "본문의 [[1]] 과 같은 번호." }
          - { name: text, label: 내용, widget: markdown, modes: [rich_text, raw],
              buttons: [bold, italic, link], editor_components: [], minimal: true }


      - { name: cover, label: Cover image, widget: image, required: false }
      - name: cover_caption
        label: Cover caption
        widget: markdown
        required: false
        modes: [rich_text, raw]
        buttons: [bold, italic, link]
        editor_components: []
        minimal: true
        hint: "작품 제목은 글자를 고르고 기울임(Ctrl+I)을 누르세요."


      # ── 미디어 ────────────────────────────────────────────────
      - name: media
        label: Images & videos
        label_singular: Item
        widget: list
        required: false
        collapsed: true
        thumbnail: src
        types:
          - name: image
            label: Image
            summary: "{{fields.caption}}"
            fields:
              - { name: src, label: File, widget: image }
              - name: caption
                label: Caption
                widget: markdown
                required: false
                modes: [rich_text, raw]
                buttons: [bold, italic, link]
                editor_components: []
                minimal: true
          - name: video
            label: Video
            summary: "{{fields.caption}}"
            fields:
              - { name: src, label: Embed URL, widget: string,
                  hint: "Vimeo나 YouTube의 embed 주소를 넣으세요." }
              - name: caption
                label: Caption
                widget: markdown
                required: false
                modes: [rich_text, raw]
                buttons: [bold, italic, link]
                editor_components: []
                minimal: true
          - name: divider
            label: Divider
            summary: "— 구분선 —"
            fields:
              - { name: spacer, widget: hidden, required: false }

      - { name: hide_cover_if_video_top, label: "영상이 첫 항목이면 커버 숨기기",
          widget: boolean, required: false }

      # ── 표 ────────────────────────────────────────────────────
      - { name: tables, label: "표", widget: worktable, required: false, preview: false }

      # ── 연결 ──────────────────────────────────────────────────
      - { name: linked_works_title, widget: hidden, default: "Linked works" }
      # 작업 목록에서 체크해서 한 번에 넣는다. 파일에 저장되는 모양은 예전과 같은
      # [{label, path}] 라서 사이트도 이미 있는 값도 그대로 쓴다.
      - { name: linked_works, label: Linked works, widget: worklinks, required: false }

      - { name: critique_title, widget: hidden, default: "Related texts" }
      - name: related_texts
        label: Related texts
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.id}}"
        fields:
          - { name: id, label: Text, widget: relation, required: false,
              collection: texts, value_field: id,
              search_fields: [title_en, id, "author.name"],
              display_fields: ["{{year}}  {{author.name}} — {{title_en}}"] }

  # ─────────────────────────────────────────────────────────────
  # Texts — _data/texts/{id}.yml (front matter 없는 순수 YAML)
  # ─────────────────────────────────────────────────────────────
  - name: texts
    label: Texts
    label_singular: Text
    folder: _data/texts
    create: true
    extension: yml
    format: yaml
    slug: "{{title_en}}"
    identifier_field: id
    summary: "{{year}}  {{author.name}} — {{title_en}}"
    sortable_fields: [year, author.family, title_en, id]
    fields:
      - { name: id, label: ID, widget: string,
          hint: "파일 이름과 같아야 합니다. 작업에서 이 글을 연결할 때 쓰는 이름입니다." }

      - name: title_original
        label: 원문 제목
        widget: object
        fields:
          - { name: text_html, label: 제목, widget: string }
          - { name: language, label: 언어, widget: string,
              hint: "fr, en, sv 처럼 두 글자로." }

      - { name: title_en, label: 영문 제목, widget: string,
          hint: "목록과 작업 페이지의 '연결된 글'에 이 제목이 쓰입니다. 영문 제목이 없으면 원문 제목을 그대로 적어주세요." }

      - name: author
        label: 필자
        widget: object
        fields:
          - { name: name, label: 이름 (표시용), widget: string,
              hint: "사이트에 나오는 이름입니다. 예: Gunilla Petri" }
          - { name: family, label: 성 (정렬용), widget: string, required: false,
              hint: "에디터 목록을 성으로 정렬할 때만 씁니다. 사이트에는 안 나옵니다." }
          - { name: bio_html, label: 소개, widget: text, required: false }

      - { name: year, label: 연도, widget: number, value_type: string, preview: false }
      - { name: date_written, label: 작성일, widget: datetime,
          date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }

      - { name: source_html, label: 출처, widget: text, required: false }

      # 본문은 마크다운으로 저장한다. 사이트(texts.html)가 빌드할 때 HTML 로 바꾼다.
      # 주석은 원문 안·번역본 안에 각각 들어 있다 — 예전 설정은 글 맨 바깥을 가리켜서
      # 주석 86개가 에디터에서 아예 안 보였다.
      - name: original
        label: 원문
        widget: object
        fields:
          - { name: language, label: 언어, widget: string }
          - name: body
            label: 본문
            widget: markdown
            modes: [rich_text, raw]
            buttons: [bold, italic, link]
            editor_components: []
            hint: "주석 번호는 [[1]] 처럼 적으면 사이트에서 위첨자로 나옵니다."
          - name: notes
            label: 주석
            widget: list
            required: false
            collapsed: true
            summary: "[{{fields.id}}] {{fields.text}}"
            fields:
              - { name: id, label: 번호, widget: number, value_type: int,
                  hint: "본문의 [[1]] 과 같은 번호." }
              - { name: text, label: 내용, widget: markdown, modes: [rich_text, raw],
                  buttons: [bold, italic, link], editor_components: [], minimal: true }

      - name: translations
        label: 번역
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.language}}"
        fields:
          - { name: language, label: 언어, widget: string }
          - { name: translator, label: 번역자, widget: string, required: false }
          - name: body
            label: 본문
            widget: markdown
            modes: [rich_text, raw]
            buttons: [bold, italic, link]
            editor_components: []
            hint: "주석 번호는 [[1]] 처럼 적으면 사이트에서 위첨자로 나옵니다."
          - name: notes
            label: 주석
            widget: list
            required: false
            collapsed: true
            summary: "[{{fields.id}}] {{fields.text}}"
            fields:
              - { name: id, label: 번호, widget: number, value_type: int,
                  hint: "본문의 [[1]] 과 같은 번호." }
              - { name: text, label: 내용, widget: markdown, modes: [rich_text, raw],
                  buttons: [bold, italic, link], editor_components: [], minimal: true }

      - name: related_works
        label: 관련 작업
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.label}}"
        fields:
          - { name: label, label: 표시 이름, widget: string, required: false }
          - { name: slug, label: 경로, widget: string, required: false,
              hint: "work/2023/hostis — 앞의 / 와 뒤의 .html 은 빼고 적습니다." }

  # ─────────────────────────────────────────────────────────────
  # 관리 — Type · Tag  (_data/taxonomy.yml)
  # ─────────────────────────────────────────────────────────────
  - name: settings
    label: 관리
    editor:
      preview: false
    files:
      - name: taxonomy
        label: "Type · Tag · Status"
        file: _data/taxonomy.yml
        fields:
          - { name: groups, label: "Type · Tag · Status 목록", widget: taxonomy, required: false }
      - name: media
        label: "안 쓰는 사진"
        file: _data/media.yml
        fields:
          - { name: note, label: "안 쓰는 사진 · 휴지통", widget: unusedmedia, required: false }
